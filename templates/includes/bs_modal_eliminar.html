<div class="modal fade" id="modal-eliminar" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">{{ titulo }}</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
            </div>
            <div class="modal-body">
                ¿Seguro que quieres {{ verbo|default:"eliminar" }} <strong id="modal-nombre"></strong>?
                {{ aviso }} Esta accion no se puede deshacer.
            </div>
            <form method="post" id="form-eliminar">
                {% csrf_token %}
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">{{ volver|default:"Cancelar" }}</button>
                    <button type="submit" class="btn btn-danger">{{ boton|default:"Eliminar" }}</button>
                </div>
            </form>
        </div>
    </div>
</div>
